name: Validate GitHub Pages artifact

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["public/**", ".github/workflows/pages.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Validate explicit public allowlist
        run: python -c "from pathlib import Path; from news_intelligence.publishing import validate_public_tree; validate_public_tree(Path('public'))"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy-pages:
    needs: validate-pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
